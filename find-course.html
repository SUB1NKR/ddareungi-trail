<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>나만의 코스 찾기 | 따릉이 트레일</title>

  <link rel="stylesheet" href="./find-course.css" />
</head>

<body>
  <header id="gnb" class="site-gnb">
    <a href="./index.html" class="gnb-logo" aria-label="따릉이 트레일 홈">
      <img src="./assets/icons/ddareungi-logo.png" alt="따릉이 트레일" />
    </a>

    <button id="menuButton" class="gnb-menu-button" type="button" aria-label="메뉴 열기">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </header>

  <section id="menuPanel" class="menu-panel" aria-label="전체 메뉴">
    <div class="menu-content">
      <nav class="menu-nav">
        <a href="./index.html" class="menu-link" style="--i: 0">
          <span>홈</span>
        </a>

        <a href="./course.html" class="menu-link" style="--i: 1">
          <span>20코스 안내</span>
        </a>

        <a href="./find-course.html" class="menu-link" style="--i: 2">
          <span>나만의 코스 찾기</span>
        </a>
      </nav>

      <div class="menu-icon-list">
        <a href="https://www.facebook.com/seoulbike" target="_blank" rel="noopener noreferrer" class="menu-sns-link" style="--i: 3">
          <img src="./assets/icons/menu-icon-01.png" alt="서울자전거 페이스북" />
        </a>

        <a href="https://www.instagram.com/seoulbike_/" target="_blank" rel="noopener noreferrer" class="menu-sns-link" style="--i: 2">
          <img src="./assets/icons/menu-icon-02.png" alt="서울자전거 인스타그램" />
        </a>

        <a href="https://blog.naver.com/2seoulbike" target="_blank" rel="noopener noreferrer" class="menu-sns-link" style="--i: 1">
          <img src="./assets/icons/menu-icon-03.png" alt="서울자전거 블로그" />
        </a>

        <a href="https://www.youtube.com/@seoulbike_" target="_blank" rel="noopener noreferrer" class="menu-sns-link" style="--i: 0">
          <img src="./assets/icons/menu-icon-04.png" alt="서울자전거 유튜브" />
        </a>
      </div>
    </div>

    <p class="menu-copyright">
      COPYRIGHT ⓒ 2026 1_je0.in_ All RIGHTS RESERVED.
    </p>
  </section>

  <main class="find-page">
    <section id="introSection" class="intro-section">
      <div class="intro-bg-shape shape-01"></div>
      <div class="intro-bg-shape shape-02"></div>

      <div class="intro-inner">
        <p class="eyebrow">나만의 따릉이길 추천</p>

        <h1>
          오늘의 나에게 맞는<br />
          따릉이길을 찾아볼까요?
        </h1>

        <p class="intro-description">
          기분, 풍경, 함께하는 사람, 달리고 싶은 거리를 고르면<br />
          20개의 따릉이길 중 지금 가장 어울리는 코스를 추천해드릴게요.
        </p>

        <button id="startButton" class="primary-button" type="button">
          코스 찾기 시작하기
        </button>
      </div>
    </section>

    <section id="questionSection" class="question-section" aria-live="polite">
      <div class="question-progress">
        <div id="progressBar" class="progress-bar"></div>
      </div>

      <div class="question-card">
        <p id="questionCount" class="question-count">1 / 4</p>
        <h2 id="questionTitle">오늘은 어떤 분위기로 달리고 싶나요?</h2>

        <div id="answerList" class="answer-list"></div>
      </div>
    </section>

    <section id="resultSection" class="result-section">
      <div class="result-card">
        <div class="result-image-wrap">
          <img id="resultImage" src="" alt="" />
        </div>

        <div class="result-content">
          <p class="result-label">당신에게 어울리는 따릉이길은</p>

          <h2 id="resultName"></h2>

          <p id="resultDescription" class="result-description"></p>

          <div class="result-meta">
            <span id="resultTime"></span>
            <span id="resultDistance"></span>
          </div>

          <div id="resultTags" class="result-tags"></div>

          <div class="result-actions">
            <a id="courseLink" href="./course.html" class="primary-button">
              코스 자세히 보기
            </a>

            <button id="restartButton" class="secondary-button" type="button">
              다시 찾아보기
            </button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="./find-course.js"></script>
</body>
</html>
