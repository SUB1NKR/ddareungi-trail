<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>나만의 따릉이 코스 찾기</title>

  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link
    rel="stylesheet"
    as="style"
    crossorigin
    href="https://cdn.jsdelivr.net/gh/sunn-us/SUIT/fonts/static/woff2/SUIT.css"
  />

  <link rel="stylesheet" href="./find-course.css" />
</head>
<body>
  <header class="course-gnb">
    <a class="course-gnb__logo" href="./index.html?skipLoading=1">
      <img src="./assets/icons/ddareungi-logo.png" alt="따릉이길" />
    </a>

    <a class="course-gnb__back" href="./index.html?skipLoading=1">
      메인으로 돌아가기
    </a>
  </header>

  <main class="course-page">
    <section class="course-hero is-active" id="startView">
      <div class="course-hero__media">
        <div class="course-hero__image course-hero__image--one"></div>
        <div class="course-hero__image course-hero__image--two"></div>
      </div>

      <div class="course-hero__content">
        <p class="course-hero__eyebrow">Ddareungi Course Finder</p>
        <h1 class="course-hero__title">
          오늘의 서울은<br />
          어떤 길로 달려볼까요?
        </h1>
        <p class="course-hero__desc">
          몇 가지 선택을 바탕으로 지금의 기분과 가까운 따릉이길을 추천해드립니다.
          익숙한 거리도 자전거 위에서는 조금 다르게 보일 수 있습니다.
        </p>
        <button class="course-hero__button" id="startQuizButton" type="button">
          코스 찾기 시작하기
        </button>
      </div>
    </section>

    <section class="question-view" id="questionView" aria-hidden="true">
      <div class="question-view__inner">
        <div class="question-view__top">
          <p class="question-view__count" id="questionCount">1 / 4</p>
          <div class="question-view__progress">
            <span id="questionProgress"></span>
          </div>
        </div>

        <h2 class="question-view__title" id="questionTitle"></h2>
        <p class="question-view__desc" id="questionDesc"></p>

        <div class="answer-list" id="answerList"></div>

        <button class="question-view__prev" id="prevQuestionButton" type="button">
          이전 질문으로
        </button>
      </div>
    </section>

    <section class="result-loading" id="resultLoading" aria-hidden="true">
      <div class="result-loading__inner">
        <p class="result-loading__eyebrow">Finding Course</p>
        <h2 class="result-loading__title">
          당신에게 어울리는<br />
          따릉이길을 찾고 있습니다.
        </h2>
        <div class="result-loading__bar">
          <span></span>
        </div>
      </div>
    </section>

    <section class="result-view" id="resultView" aria-hidden="true">
      <div class="result-view__background" id="resultBackground"></div>

      <div class="result-view__content">
        <p class="result-view__eyebrow">Recommended Course</p>
        <p class="result-view__number" id="resultNumber"></p>
        <h2 class="result-view__title" id="resultTitle"></h2>

        <div class="result-view__meta">
          <div>
            <span>거리</span>
            <strong id="resultDistance"></strong>
          </div>
          <div>
            <span>소요 시간</span>
            <strong id="resultTime"></strong>
          </div>
        </div>

        <p class="result-view__desc" id="resultDesc"></p>

        <div class="result-view__tags" id="resultTags"></div>

        <div class="result-view__buttons">
          <a class="result-view__button result-view__button--primary" id="resultDetailLink" href="#" target="_blank" rel="noopener noreferrer">
            코스 자세히 보기
          </a>
          <button class="result-view__button result-view__button--secondary" id="restartButton" type="button">
            다시 추천받기
          </button>
        </div>
      </div>
    </section>
  </main>

  <script src="./find-course.js"></script>
</body>
</html>
