<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="나에게 맞는 따릉이길 코스 찾기" />
  <title>나만의 코스 찾기 | 따릉이길</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/sunn-us/SUIT/fonts/static/woff2/SUIT.css" />
  <link rel="stylesheet" href="./find-course.css" />
</head>
<body>
  <header class="finder-header">
    <a class="logo" href="./index.html?skipLoading=1">따릉이길</a>
    <a class="back-link" href="./index.html?skipLoading=1">메인으로</a>
  </header>

  <main class="finder-page">
    <section class="finder-hero">
      <div>
        <p class="tag">나만의 따릉이 코스 추천</p>
        <h1>질문에 답하다 보면,<br />나에게 맞는 따릉이길이 도착합니다</h1>
      </div>
      <p>분위기, 길의 유형, 동행 방식, 라이딩 거리를 선택하면 가장 잘 어울리는 코스를 추천합니다.</p>
    </section>

    <section class="finder-layout" aria-label="코스 추천 질문">
      <form class="question-panel" id="courseForm">
        <fieldset class="question-block">
          <legend>어떤 분위기의 길을 원하시나요?</legend>
          <label><input type="radio" name="mood" value="healing" required /> 여유롭게 쉬어가는 길</label>
          <label><input type="radio" name="mood" value="view" /> 풍경이 좋은 길</label>
          <label><input type="radio" name="mood" value="city" /> 도심을 지나는 길</label>
          <label><input type="radio" name="mood" value="night" /> 야경이 좋은 길</label>
        </fieldset>

        <fieldset class="question-block">
          <legend>선호하는 길의 유형은 무엇인가요?</legend>
          <label><input type="radio" name="type" value="river" required /> 한강과 가까운 길</label>
          <label><input type="radio" name="type" value="park" /> 공원과 초록이 많은 길</label>
          <label><input type="radio" name="type" value="stream" /> 천변을 따라가는 길</label>
          <label><input type="radio" name="type" value="urban" /> 도시 풍경이 보이는 길</label>
        </fieldset>

        <fieldset class="question-block">
          <legend>누구와 함께 달리고 싶나요?</legend>
          <label><input type="radio" name="with" value="alone" required /> 혼자 천천히</label>
          <label><input type="radio" name="with" value="couple" /> 연인과 함께</label>
          <label><input type="radio" name="with" value="friends" /> 친구와 가볍게</label>
          <label><input type="radio" name="with" value="afterwork" /> 퇴근 후 짧게</label>
        </fieldset>

        <fieldset class="question-block">
          <legend>라이딩 거리는 어느 정도가 좋나요?</legend>
          <label><input type="radio" name="distance" value="short" required /> 짧고 가볍게</label>
          <label><input type="radio" name="distance" value="medium" /> 30분 안팎</label>
          <label><input type="radio" name="distance" value="long" /> 길게 즐기기</label>
          <label><input type="radio" name="distance" value="safe" /> 안전한 자전거도로</label>
        </fieldset>

        <button class="submit-button" type="submit">코스 추천받기</button>
      </form>

      <aside class="result-panel" id="resultPanel" aria-live="polite">
        <p class="result-kicker">Recommended Course</p>
        <h2>나에게 맞는 코스를 선택해보세요</h2>
        <p>질문에 답하면 선택한 태그와 가장 많이 일치하는 코스를 추천합니다.</p>
      </aside>
    </section>
  </main>

  <script src="./find-course.js" defer></script>
</body>
</html>
