        </a>

        <a href="https://www.instagram.com/seoulbike_/" target="_blank" rel="noopener noreferrer" class="menu-sns-link" style="--i: 2">

        </a>

        <a href="https://blog.naver.com/2seoulbike" target="_blank" rel="noopener noreferrer" class="menu-sns-link" style="--i: 1">

        <a href="https://www.youtube.com/@seoulbike_" target="_blank" rel="noopener noreferrer" class="menu-sns-link" style="--i: 0">

  <main class="find-page">
    <section id="introSection" class="intro-section">
      <div class="rolling-gallery" aria-hidden="true">
        <div class="rolling-row">
          <div class="rolling-track">

            <img src="./assets/recommend/course-13.jpg" alt="" />
            <img src="./assets/recommend/course-17.jpg" alt="" />
            <img src="./assets/recommend/course-20.jpg" alt="" />
          </div>
        </div>

        <div class="rolling-row">
          <div class="rolling-track reverse">
            <img src="./assets/recommend/course-02.jpg" alt="" />
            <img src="./assets/recommend/course-06.jpg" alt="" />
            <img src="./assets/recommend/course-10.jpg" alt="" />

            <img src="./assets/recommend/course-02.jpg" alt="" />

            <img src="./assets/recommend/course-14.jpg" alt="" />
            <img src="./assets/recommend/course-18.jpg" alt="" />
            <img src="./assets/recommend/course-03.jpg" alt="" />
          </div>
        </div>

        <div class="rolling-row">
          <div class="rolling-track slow">
            <img src="./assets/recommend/course-04.jpg" alt="" />
            <img src="./assets/recommend/course-07.jpg" alt="" />
            <img src="./assets/recommend/course-11.jpg" alt="" />
            <img src="./assets/recommend/course-15.jpg" alt="" />
            <img src="./assets/recommend/course-16.jpg" alt="" />
            <img src="./assets/recommend/course-19.jpg" alt="" />

            <img src="./assets/recommend/course-04.jpg" alt="" />

            <img src="./assets/recommend/course-16.jpg" alt="" />
            <img src="./assets/recommend/course-19.jpg" alt="" />
          </div>
        </div>
      </div>

      <div class="intro-dim"></div>

      <div class="intro-card">
        <p class="intro-label">나만의 따릉이 코스 추천</p>

        <h1>
          따릉이로 만나는<br />
          새로운 서울
        </h1>

        <p class="intro-description">
          익숙한 거리도 자전거로 달리면 조금 다르게 보입니다.<br />
          20개의 따릉이길을 따라 나만의 서울을 발견해보세요.
        </p>

        <button id="startButton" class="primary-button" type="button">
          코스 추천 받으러 가기!
        </button>
      </div>
    </section>

    <section id="questionSection" class="question-section" aria-live="polite">
      <div class="question-progress">
        <div id="progressBar" class="progress-bar"></div>
      </div>

      <div class="question-card">
        <p id="questionCount" class="question-count">1 / 4</p>

        <h2 id="questionTitle">오늘은 어떤 분위기로 달리고 싶나요?</h2>

        <div id="answerList" class="answer-list"></div>

        <div class="question-actions">
          <button id="prevButton" class="prev-button" type="button">
            이전 질문
          </button>
        </div>
      </div>
    </section>

    <section id="findingSection" class="finding-section">
      <div class="finding-card">
        <div class="finding-spinner"></div>

        <h2>추천 코스 찾는 중</h2>

        <p>
          선택한 답변을 바탕으로<br />
          가장 어울리는 따릉이길을 고르고 있어요.
        </p>
      </div>
    </section>

    <section id="resultSection" class="result-section">
      <div class="result-card">
        <div class="result-image-wrap">
          <img id="resultImage" src="" alt="" />
        </div>

        <div class="result-content">
          <p class="result-label">당신에게 어울리는 따릉이길은</p>

          <p id="resultNumber" class="result-number"></p>

          <h2 id="resultName"></h2>

          <p id="resultDescription" class="result-description"></p>

          <div id="resultTags" class="result-tags"></div>

          <div class="result-meta">
            <div class="meta-card">
              <span>소요시간</span>
              <strong id="resultTime"></strong>
            </div>

            <div class="meta-card">
              <span>거리</span>
              <strong id="resultDistance"></strong>
            </div>
          </div>

          <div class="result-actions">
            <a id="courseLink" href="#" class="primary-button">
              코스 자세히 보기
            </a>

            <button id="restartButton" class="secondary-button" type="button">
              다시 찾아보기
            </button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="externalNotice" class="external-notice">
    <div class="external-notice-card">
      <p>외부 페이지로 이동합니다.</p>
    </div>
  </div>

  <script src="./find-course.js"></script>
</body>
</html>
