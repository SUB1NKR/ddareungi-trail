<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>따릉이 트레일</title>

  <link rel="stylesheet" href="./style.css" />
</head>

<body>
  <div id="customCursor" class="custom-cursor" aria-hidden="true"></div>

  <section id="adaptivePopup" class="adaptive-popup" aria-label="브라우저 안내">
    <div class="adaptive-card">
      <p class="adaptive-title">최적의 경험을 위해</p>
      <p class="adaptive-description">
        Chrome 브라우저와 데스크톱 환경에서 가장 안정적으로 감상할 수 있습니다.
      </p>
      <button id="startButton" class="adaptive-button" type="button">시작하기</button>
    </div>
  </section>

  <section id="loading" class="loading-page" aria-label="로딩 화면">
    <div class="safety-slider">
      <img class="safety-slide is-active" src="./assets/safety/safety-01.png" alt="따릉이 안전 안내 1" />
      <img class="safety-slide" src="./assets/safety/safety-02.png" alt="따릉이 안전 안내 2" />
      <img class="safety-slide" src="./assets/safety/safety-03.png" alt="따릉이 안전 안내 3" />
    </div>

    <div class="loading-content">
      <p class="loading-title" aria-label="Loading">
        <span style="--i:0">L</span>
        <span style="--i:1">o</span>
        <span style="--i:2">a</span>
        <span style="--i:3">d</span>
        <span style="--i:4">i</span>
        <span style="--i:5">n</span>
        <span style="--i:6">g</span>
      </p>

      <div class="loading-bar">
        <div id="loadingFill" class="loading-fill"></div>
      </div>
    </div>
  </section>

  <header id="gnb" class="site-gnb" aria-label="상단 메뉴">
    <a href="./index.html?skipLoading=1" class="gnb-logo" aria-label="따릉이 트레일 홈">
      <img src="./assets/icons/ddareungi-logo.png" alt="따릉이 트레일" />
    </a>

    <button id="menuButton" class="gnb-menu-button" type="button" aria-label="메뉴 열기">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </header>

  <section id="menuPanel" class="menu-panel" aria-label="전체 메뉴">
    <div class="menu-content">
      <nav class="menu-nav">
        <a href="./index.html?skipLoading=1" class="menu-link" style="--i:0">
          <span>홈</span>
        </a>

        <a href="#" id="courseIndexExternalLink" class="menu-link" style="--i:1">
          <span>20코스 안내</span>
        </a>

        <a href="./find-course.html" class="menu-link" style="--i:2">
          <span>나만의 코스 찾기</span>
        </a>
      </nav>

      <div class="menu-icon-list">
        <a href="https://www.facebook.com/seoulbike" target="_blank" rel="noopener noreferrer" class="menu-sns-link" style="--i:3">
          <img src="./assets/icons/menu-icon-01.png" alt="서울자전거 페이스북" />
        </a>

        <a href="https://www.instagram.com/seoulbike_/" target="_blank" rel="noopener noreferrer" class="menu-sns-link" style="--i:2">
          <img src="./assets/icons/menu-icon-02.png" alt="서울자전거 인스타그램" />
        </a>

        <a href="https://blog.naver.com/2seoulbike" target="_blank" rel="noopener noreferrer" class="menu-sns-link" style="--i:1">
          <img src="./assets/icons/menu-icon-03.png" alt="서울자전거 블로그" />
        </a>

        <a href="https://www.youtube.com/@seoulbike_" target="_blank" rel="noopener noreferrer" class="menu-sns-link" style="--i:0">
          <img src="./assets/icons/menu-icon-04.png" alt="서울자전거 유튜브" />
        </a>
      </div>
    </div>

    <p class="menu-copyright">COPYRIGHT ⓒ 2026 1_je0.in_ All RIGHTS RESERVED.</p>
  </section>

  <main id="main" class="main-page">
    <section id="scrollSection" class="scroll-section">
      <canvas id="sequenceCanvas" class="sequence-canvas" aria-label="따릉이 트레일 이미지 시퀀스"></canvas>

      <div id="scrollGuide" class="scroll-guide">
        <span class="scroll-guide-text">Scroll</span>
        <span class="scroll-guide-line"></span>
      </div>

      <div id="endCta" class="end-cta">
        <p>그럼 서울 따라서 따릉이길 만나러 가볼까요?</p>
        <a href="./find-course.html">나만의 코스 찾기</a>
      </div>
    </section>
  </main>

  <div id="externalNotice" class="external-notice" role="dialog" aria-modal="true" aria-label="외부 페이지 이동 안내">
    <div class="external-notice-card">
      <p>외부 페이지로 이동합니다.</p>

      <div class="external-notice-actions">
        <button id="externalCancelButton" class="external-cancel-button" type="button">취소</button>
        <button id="externalMoveButton" class="external-move-button" type="button">이동하기</button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
  <script src="./script.js"></script>
</body>
</html>
